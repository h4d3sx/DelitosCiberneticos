<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at center, #101c35 0%, #050914 45%, #020308 100%);
            color: #00f7ff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Rejilla cibernética */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 247, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 247, 255, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(55deg) scale(1.5);
            transform-origin: center bottom;
            animation: gridMove 8s linear infinite;
        }

        /* Líneas decorativas */
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 3px,
                    rgba(0, 247, 255, 0.025) 4px
                );
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 60px 80px;
            border: 1px solid rgba(0, 247, 255, 0.5);
            background: rgba(3, 10, 25, 0.65);
            box-shadow:
                0 0 20px rgba(0, 247, 255, 0.25),
                inset 0 0 30px rgba(0, 247, 255, 0.05);
            backdrop-filter: blur(8px);
        }

        .subtitle {
            font-size: 18px;
            letter-spacing: 8px;
            color: #7dfcff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(60px, 10vw, 150px);
            font-weight: 900;
            letter-spacing: 8px;
            color: #ffffff;
            text-shadow:
                0 0 5px #00f7ff,
                0 0 15px #00f7ff,
                0 0 30px #00f7ff,
                0 0 60px rgba(0, 247, 255, 0.8);
            animation: pulse 2.5s ease-in-out infinite alternate;
        }

        .line {
            width: 80%;
            height: 2px;
            margin: 30px auto 20px;
            background: #00f7ff;
            box-shadow:
                0 0 5px #00f7ff,
                0 0 15px #00f7ff;
        }

        .status {
            font-size: 14px;
            letter-spacing: 4px;
            color: #00ff9d;
            text-transform: uppercase;
        }

        .status::before {
            content: "●";
            margin-right: 10px;
            text-shadow: 0 0 10px #00ff9d;
        }

        /* Esquinas decorativas */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #00f7ff;
            border-style: solid;
        }

        .top-left {
            top: -1px;
            left: -1px;
            border-width: 3px 0 0 3px;
        }

        .top-right {
            top: -1px;
            right: -1px;
            border-width: 3px 3px 0 0;
        }

        .bottom-left {
            bottom: -1px;
            left: -1px;
            border-width: 0 0 3px 3px;
        }

        .bottom-right {
            bottom: -1px;
            right: -1px;
            border-width: 0 3px 3px 0;
        }

        @keyframes pulse {
            from {
                text-shadow:
                    0 0 5px #00f7ff,
                    0 0 15px #00f7ff,
                    0 0 30px #00f7ff;
            }

            to {
                text-shadow:
                    0 0 10px #00f7ff,
                    0 0 25px #00f7ff,
                    0 0 50px #00f7ff,
                    0 0 80px rgba(0, 247, 255, 0.7);
            }
        }

        @keyframes gridMove {
            from {
                background-position: 0 0, 0 0;
            }

            to {
                background-position: 0 50px, 50px 0;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
                width: 90%;
            }

            h1 {
                font-size: 50px;
                letter-spacing: 3px;
            }

            .subtitle {
                font-size: 12px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="subtitle">
            Sistema de Seguridad
        </div>

        <h1>BIENVENIDO</h1>

        <div class="line"></div>

        <div class="status">
            Sistema en línea
        </div>

    </div>

</body>
</html>
